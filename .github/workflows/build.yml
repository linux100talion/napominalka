name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle test --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk protocol-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-debug
          path: android/protocol-debug.apk

      # Скользящий пре-релиз latest-debug: APK можно скачать с телефона без входа в GitHub.
      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-debug
          git push -f origin latest-debug
          gh release view latest-debug >/dev/null 2>&1 || \
            gh release create latest-debug --prerelease --title "Debug build" --notes "Автосборка из main. Подпись debug."
          gh release upload latest-debug protocol-debug.apk --clobber
